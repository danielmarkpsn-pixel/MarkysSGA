# Camada de producao. Use junto com compose.yaml:
# docker compose -f compose.yaml -f compose.production.yaml up -d --build
services:
  database:
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no arquivo .env}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no arquivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports: []

  app:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-local}
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ${APP_SECRET:?Defina APP_SECRET no arquivo .env}
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL no arquivo .env}
      MERCURE_URL: http://127.0.0.1:8080/.well-known/mercure
      MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL:-http://localhost:8080/.well-known/mercure}
      MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET:?Defina MERCURE_JWT_SECRET no arquivo .env}
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET:?Defina MERCURE_JWT_SECRET no arquivo .env}
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\\\"127.0.0.1\\\",8080) ? 0 : 1);'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
